<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Küme · post matcha Benimaclet</title>
<link rel="stylesheet" href="./fonts/fonts.css">
<style>
  :root{
    /* Paleta matcha derivada de la foto + marca Küme */
    --matcha:        #8b9a4e;
    --matcha-dark:   #6d7c39;
    --matcha-deep:   #56652a;
    --matcha-light:  #a9b672;
    --matcha-pale:   #c6d09b;
    --hielo:         #dfe7c8;
    --verde-kume:    #2f4436;
    --crema:         #efe7d6;
    --tinta:         #111111;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{background:#fff}
  #post{
    position:relative;
    width:1080px;height:1350px;
    background:#ffffff;
    overflow:hidden;
    font-family:'Inter',sans-serif;
  }

  /* ---------- 1. Bodegón: el vaso volcado ---------- */
  #vaso{
    position:absolute;
    left:252px;top:52px;width:772px;
    z-index:2;
    transform:rotate(-2deg);
  }

  /* ---------- 2. Charco de matcha (bajo el vaso) ---------- */
  #charco{position:absolute;inset:0;z-index:1}

  /* ---------- 3. Banda negra tipo interfaz ---------- */
  #ui{
    position:absolute;left:0;top:560px;width:1080px;height:398px;
    background:#000;z-index:3;color:#fff;
  }
  #ui .acciones{
    position:absolute;left:46px;top:52px;right:46px;height:58px;
    display:flex;align-items:center;gap:0;
  }
  #ui .acciones .item{display:flex;align-items:center;gap:14px;margin-right:38px}
  #ui .acciones .num{font-size:37px;font-weight:500;letter-spacing:-0.01em;line-height:1}
  #ui svg{display:block}
  #ui .marcador{position:absolute;right:0;top:2px}

  #ui .pie{
    position:absolute;left:48px;right:60px;top:150px;
    font-size:35px;line-height:1.25;letter-spacing:-0.005em;
    color:#fff;
  }
  #ui .pie b{font-weight:700;margin-right:16px}
  #ui .pie .emoji{font-family:'Noto Color Emoji','Inter',sans-serif}

  #ui .cuenta{
    position:absolute;left:40px;right:40px;top:250px;height:104px;
    display:flex;align-items:center;
  }
  #ui .cuenta .avatar{
    width:100px;height:100px;border-radius:50%;
    background:var(--verde-kume);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    flex:0 0 auto;box-shadow:0 0 0 3px #000;
  }
  #ui .cuenta .avatar .n{
    font-family:'Noto Serif',serif;font-weight:700;font-size:34px;
    color:var(--crema);line-height:1;letter-spacing:0.01em;
  }
  #ui .cuenta .avatar .c{
    font-family:'Inter',sans-serif;font-weight:400;font-size:11px;
    color:var(--crema);opacity:.92;letter-spacing:.06em;margin-top:3px;
  }
  #ui .cuenta .user{
    margin-left:34px;font-size:46px;font-weight:600;letter-spacing:-0.015em;
  }
  #ui .cuenta .mas{margin-left:auto;display:flex;gap:9px}
  #ui .cuenta .mas i{width:11px;height:11px;border-radius:50%;background:#fff;display:block}

  /* ---------- 4. El hilo de matcha que atraviesa la interfaz ---------- */
  #hilo{position:absolute;inset:0;z-index:4;pointer-events:none}

  /* ---------- 5. Ilustración de línea ---------- */
  #gente{position:absolute;inset:0;z-index:3}

  /* ---------- 6. Icono de silencio ---------- */
  #mute{position:absolute;right:44px;bottom:44px;z-index:5}
</style>
</head>
<body>
<div id="post">

        <stop offset="1" stop-color="#75853e"/>

      <radialGradient id="gBrillo" cx="0.35" cy="0.3" r="0.7">
        <stop offset="0" stop-color="#c9d49e" stop-opacity="0.85"/>
        <stop offset="1" stop-color="#c9d49e" stop-opacity="0"/>

    <ellipse cx="286" cy="486" rx="62" ry="16" fill="url(#gBrillo)" opacity="0.6"/>

    <ellipse cx="640" cy="452" rx="220" ry="40" fill="#5c6b2e" opacity="0.22"/>

    <!-- hielos derramados -->
    <g>
      <g transform="translate(714,470) rotate(-14)">

        <path d="M-24,-13 L6,-18 L18,10" fill="none" stroke="#ffffff" stroke-opacity="0.85" stroke-width="3"/>
        <rect x="-40" y="-28" width="80" height="56" rx="15" fill="none" stroke="#ffffff" stroke-opacity="0.5" stroke-width="2"/>
      </g>
      <g transform="translate(824,494) rotate(10)">
        <rect x="-33" y="-23" width="66" height="46" rx="13" fill="#dfe7c8" fill-opacity="0.85"/>

      </g>
      <g transform="translate(902,452) rotate(-7)">
        <rect x="-29" y="-21" width="58" height="42" rx="12" fill="#e9eeda" fill-opacity="0.8"/>

      </g>
      <g transform="translate(596,512) rotate(18)">

        <path d="M-14,-8 L3,-11 L11,7" fill="none" stroke="#ffffff" stroke-width="2.6"/>

        <rect x="-23" y="-17" width="46" height="34" rx="10" fill="#e4ead6" fill-opacity="0.95"

        <path d="M-12,-7 L3,-10 L10,6" fill="none" stroke="#ffffff" stroke-width="2.4"/>
      </g>
    </g>

    <!-- salpicaduras -->
    <g fill="#8b9a4e">
      <ellipse cx="146" cy="474" rx="24" ry="13" transform="rotate(-20 146 474)"/>
      <ellipse cx="112" cy="518" rx="12" ry="8"  transform="rotate(-12 112 518)"/>
      <ellipse cx="982" cy="410" rx="17" ry="10" transform="rotate(24 982 410)"/>
      <ellipse cx="1016" cy="472" rx="10" ry="7"/>
      <ellipse cx="214" cy="404" rx="12" ry="8"/>
      <ellipse cx="930" cy="380" rx="9"  ry="6"/>
      <ellipse cx="352" cy="378" rx="8"  ry="5" transform="rotate(-15 352 378)"/>

      <circle  cx="1046" cy="436" r="6"/>
      <circle  cx="270" cy="366" r="5"/>
      <circle  cx="884" cy="344" r="4.5"/>
    </g>
  </svg>

  <!-- ============ VASO ============ -->
  <img id="vaso" src="./assets/vaso-volcado.png" alt="Vaso de matcha volcado">

  <!-- ============ INTERFAZ ============ -->

      <div class="marcador">

          <path d="M19.2 21.4 12 16.1l-7.2 5.3V4.5a2 2 0 0 1 2-2h10.4a2 2 0 0 1 2 2Z"/>
        </svg>
      </div>
    </div>

    <div class="pie">
      <b id="t-user1">kume.cafe</b><span id="t-pie">¿Adivinas quién está en Benimaclet?</span> <span class="emoji">👀</span>
    </div>

    <div class="cuenta">
      <div class="avatar"><span class="n">Küme</span><span class="c">CAFETERÍA</span></div>
      <span class="user" id="t-user2">kume.cafe</span>
      <span class="mas"><i></i><i></i><i></i></span>
    </div>
  </div>

  <!-- ============ ILUSTRACIÓN ============ -->
